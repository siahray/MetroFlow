name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "metroflow-mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "metroflow-mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metroflow-mobile
    steps:
      - uses: actions/checkout@v7

      # The driver app is a Bun package (bun.lock); there is no package-lock.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit
