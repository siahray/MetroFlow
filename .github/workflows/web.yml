name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "metroflow-admin/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "metroflow-admin/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metroflow-admin
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('metroflow-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test lib components

      # next build also runs the TypeScript check, so a type error fails CI.
      - name: Build
        run: bun run build

  e2e:
    name: Portal smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metroflow-admin
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('metroflow-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # The API is stubbed in the browser, so no database or secrets are needed.
      - name: Run E2E smoke
        run: bun run test:e2e

      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artefacts
          path: metroflow-admin/test-results/
          retention-days: 7
