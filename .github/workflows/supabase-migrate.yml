# Applies the Alembic history to the hosted Supabase database.
#
# Supabase is the managed Postgres (with PostGIS) the deployed API will use;
# migrations live in backend/migrations and are validated by Backend CI against
# an ephemeral PostGIS container on every push and pull request. This workflow
# only ships those already-tested revisions to the hosted database.
#
# Required secret: SUPABASE_DB_URL
#   Use the *session pooler* connection string from the Supabase dashboard
#   (Connect -> Session pooler) with `?sslmode=require`. The direct
#   `db.<ref>.supabase.co` host is IPv6-only, and GitHub-hosted runners have no
#   IPv6, so a direct URL fails to resolve.
#   Format: postgresql://postgres.<ref>:<password>@<region>.pooler.supabase.com:5432/postgres
#
# Until that secret exists the workflow stays green and skips with a notice, so
# main is not red while the project is still being created.
name: Supabase - Apply migrations

on:
  workflow_run:
    # Only migrate after the backend contract tests pass on main: a schema that
    # fails them should never reach the hosted database.
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two overlapping runs would apply the same revision twice.
  # Never cancel: interrupting DDL midway is worse than waiting for it.
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to Supabase
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    env:
      # database.py reads DATABASE_URL, so no application change is needed to
      # point the same migrations at Supabase instead of the local container.
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Check whether the database URL is configured
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=Supabase migration skipped::SUPABASE_DB_URL is not set. Add it under Settings > Secrets and variables > Actions to deploy schema changes to the hosted database."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Show current revision and pending history
        if: steps.gate.outputs.configured == 'true'
        run: |
          echo "Current revision:"
          alembic current
          echo
          echo "Known revisions:"
          alembic history

      - name: Apply migrations
        if: steps.gate.outputs.configured == 'true'
        run: alembic upgrade head

      - name: Confirm the database is at head
        if: steps.gate.outputs.configured == 'true'
        run: |
          alembic current
          {
            echo "### Supabase migrations"
            echo
            echo '```'
            alembic current
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migration failed
        if: failure()
        run: |
          echo "::error::The hosted database migration failed. Nothing was committed for this revision if the error was raised inside the upgrade transaction; re-run after fixing the revision."
