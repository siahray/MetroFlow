# GitHub CodeQL static analysis.
#
# Two languages because this repository is a monorepo: the FastAPI engine
# (SQL construction, path handling, secrets) and the Next.js client.
#
# `security-extended` goes beyond the default suite, which is what catches the
# lower-confidence variants of SQL injection and unsafe path traversal.
name: Security - CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 03:00 UTC. Catches newly published query packs even when
    # the code has not changed.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # None of the selected languages need a compilation step: Python is
          # interpreted and CodeQL extracts JS/TS directly. That keeps this off
          # the Next.js build and avoids needing Bun in the runner.
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
