# OWASP ZAP API scan.
#
# Brings up the real stack (PostGIS + Redis + FastAPI) through Docker Compose and
# feeds ZAP the live OpenAPI document, so the scan exercises the endpoints the
# mobile clients actually call. A spec-only spider would miss middleware,
# serialisation and CORS behaviour entirely.
name: Security - OWASP ZAP API Scan

on:
  schedule:
    # Weekly, Monday 02:00 UTC (10:00 Asia/Manila).
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-zap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-scan:
    name: ZAP API scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        # Rate limits raised for this scan only: ZAP's boolean-based SQLi probe
        # fires dozens of requests per parameter in seconds against
        # /auth/login, /auth/verify and /auth/send-verification, which blows
        # through the pilot-sized default ceiling (15/10 per minute) mid-scan
        # and reads the resulting 401->429 status flip as a true/false
        # differential. Confirmed false positive, not a vulnerability: login
        # and verify use parameterised SQLAlchemy, send-verification/verify
        # touch no SQL at all (verification_store.py is an in-memory dict).
        env:
          METROFLOW_RATE_LIMIT_LOGIN_PER_MIN: "1000"
          METROFLOW_RATE_LIMIT_REGISTER_PER_MIN: "1000"
        run: docker compose up -d --build postgres redis backend

      - name: Wait for the OpenAPI document
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/openapi.json -o /tmp/openapi.json; then
              echo "API ready after ${attempt} attempt(s)"
              python3 -c "import json; d=json.load(open('/tmp/openapi.json')); print('OpenAPI', d.get('openapi'), '-', len(d.get('paths', {})), 'paths')"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become ready within 120s"
          docker compose logs --tail=100 backend
          exit 1

      - name: Run ZAP API scan
        # This is a gate, not a report. ZAP exits non-zero when it finds an alert
        # at or above the configured failure threshold, which fails the job and
        # turns the weekly run red. The two Low findings this workflow started
        # with (missing X-Content-Type-Options and Cross-Origin-Resource-Policy)
        # are fixed in backend/main.py, so the baseline is clean.
        run: |
          mkdir -p zap-reports
          # ZAP runs as uid 1000 inside the container; the runner workspace is
          # not writable by it.
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://localhost:8000/openapi.json \
              -f openapi \
              -r zap-report.html \
              -w zap-report.md \
              -J zap-report.json

      - name: Verify a report was produced
        run: |
          if [ ! -s zap-reports/zap-report.json ]; then
            echo "::error::ZAP did not produce a JSON report -- treating this as a pipeline failure, not a clean scan."
            exit 1
          fi

      - name: Summarize findings
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections
          import json
          import pathlib

          path = pathlib.Path("zap-reports/zap-report.json")
          if not path.exists():
              print("## ZAP API scan\n\nNo report was produced.")
              raise SystemExit(0)

          data = json.loads(path.read_text())
          labels = {"0": "Info", "1": "Low", "2": "Medium", "3": "High"}
          counts = collections.Counter()
          alerts = []

          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  risk = labels.get(str(alert.get("riskcode")), "Unknown")
                  counts[risk] += 1
                  alerts.append((risk, alert.get("name", "unknown"), alert.get("count", "?")))

          print("## ZAP API scan\n")
          print("| Risk | Alert types |")
          print("| --- | --- |")
          for risk in ("High", "Medium", "Low", "Info"):
              print(f"| {risk} | {counts[risk]} |")

          if alerts:
              order = {"High": 0, "Medium": 1, "Low": 2, "Info": 3, "Unknown": 4}
              print("\n| Risk | Alert | Instances |")
              print("| --- | --- | --- |")
              for risk, name, count in sorted(alerts, key=lambda row: order.get(row[0], 4)):
                  print(f"| {risk} | {name} | {count} |")

          print("\nFull HTML/Markdown/JSON reports are in the `zap-api-scan-report` artifact.")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-api-scan-report
          path: zap-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs --tail=200 backend postgres

      - name: Tear down
        if: always()
        run: docker compose down -v
