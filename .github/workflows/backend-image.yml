# Builds the backend runtime image and publishes it to GHCR.
#
# Deliberately NOT triggered on every push: there is no hosting target yet, so
# this only runs on demand (workflow_dispatch) or when a backend-v* tag is cut.
# Once you pick a host, add a deploy job that consumes this image.
name: Backend Image

on:
  workflow_dispatch:
  push:
    tags:
      - "backend-v*"

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GHCR rejects uppercase path segments, and github.repository is
      # "siahray/MetroFlow". Lowercase it here rather than hardcoding.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
