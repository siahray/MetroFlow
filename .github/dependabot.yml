# Dependabot version updates.
#
# Weekly, all three ecosystems on the same schedule so a Monday review covers
# the whole repo at once. Minor, patch and major bumps are grouped into one PR
# per ecosystem: this project pins lower bounds (>=X) rather than exact
# versions, so Dependabot classifies a requirement-range bump by the
# requirement expression, not the resolved version -- filtering the group with
# `update-types: [minor, patch]` left every pip update outside the group and
# produced one PR per dependency instead. Groups here therefore take every
# update type, and a major bump is reviewed in the same PR as its siblings.
#
# web-lgu is built with Bun. The `npm` ecosystem cannot parse `bun.lock` and
# fails the update job outright ("Set package-ecosystem: bun"), so `bun` is the
# correct ecosystem here, not npm.
version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns:
          - "*"
    labels:
      - dependencies
      - backend

  - package-ecosystem: bun
    directory: /web-lgu
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      web:
        patterns:
          - "*"
    labels:
      - dependencies
      - web

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
