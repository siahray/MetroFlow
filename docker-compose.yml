version: '3.8'

services:
  # PostGIS Spatial Database for MetroFlow Graph Storage
  postgres:
    image: postgis/postgis:15-3.3-alpine
    platform: linux/amd64
    container_name: metroflow_postgis
    environment:
      POSTGRES_USER: metroflow_admin
      POSTGRES_PASSWORD: metroflow_password
      POSTGRES_DB: metroflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis In-Memory Cache & WebSocket Pub/Sub Broker
  redis:
    image: redis:7-alpine
    container_name: metroflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
