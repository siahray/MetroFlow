# Alembic configuration for the MetroFlow schema.
#
# The database URL is deliberately NOT set here. migrations/env.py reads
# DATABASE_URL (the same variable database.py uses), so one migration history
# serves the local PostGIS container, CI, and the hosted Supabase database.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# Leave empty on purpose: env.py injects the real URL at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
